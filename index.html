<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PromoZap — Escolha seus grupos de ofertas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Escolha os grupos de WhatsApp do PromoZap por assunto e receba só as ofertas que te interessam." />
<link rel="icon" type="image/png" href="icon.png" />
<style>
  :root {
    --font-heading: 'Helvetica Neue', 'SF Pro Display', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    --font-body: 'Helvetica Neue', 'SF Pro Text', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    --color-bg: #ffffff;
    --color-surface: #f5f5f7;
    --color-text: #1d1d1f;
    --color-divider: #e2e2e5;
    --color-neutral-600: #86868b;
    --color-neutral-700: #6e6e73;
    --color-whatsapp: #25d366;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1c1c1e;
      --color-surface: #2c2c2e;
      --color-text: #f5f5f7;
      --color-divider: #3a3a3c;
      --color-neutral-600: #98989d;
      --color-neutral-700: #aeaeb2;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 24px 0;
  }
  header img { border-radius: 8px; }
  header strong { font-size: 16px; }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 40px; }
  h1 {
    font-family: var(--font-heading);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 14px;
  }
  .lead {
    font-size: 17px;
    line-height: 1.55;
    color: var(--color-neutral-700);
    margin: 0 0 40px;
    max-width: 620px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card .emoji { font-size: 28px; line-height: 1; margin-bottom: 4px; }
  .card h3 { font-size: 16px; font-weight: 600; margin: 0; }
  .card p {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--color-neutral-600);
    margin: 0 0 14px;
    flex-grow: 1;
  }
  .card a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--color-whatsapp);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    transition: opacity 0.15s;
  }
  .card a:hover { opacity: 0.88; }
  .card.destaque {
    background: var(--color-text);
    color: var(--color-bg);
  }
  .card.destaque p { color: var(--color-bg); opacity: 0.72; }
  .card.destaque a { background: var(--color-bg); color: var(--color-text); }
  footer {
    max-width: 880px;
    margin: 24px auto 0;
    padding: 24px 24px 56px;
    border-top: 1px solid var(--color-divider);
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 13px;
    color: var(--color-neutral-600);
  }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <img src="icon.png" alt="PromoZap" width="30" height="30" />
    <strong>PromoZap</strong>
  </header>

  <main>
    <h1>Escolha os grupos que combinam com você</h1>
    <p class="lead">
      O PromoZap manda ofertas de verdade da Shopee e do Mercado Livre pro WhatsApp. Entra só nos grupos do seu
      interesse — cada um recebe promoções só daquele assunto.
    </p>

    <div class="grid" id="grid">
      <p class="lead">Carregando grupos…</p>
    </div>
  </main>

  <script>
    // Lista de grupos vem de grupos.json (não hardcoded) pra dar pra
    // atualizar sozinho — quando um nicho satura no WhatsApp (~1024
    // membros) e ganha um #2, o backend do PromoZap sobrescreve esse
    // arquivo direto via API do GitHub (ver GrupoCapacidadeScheduler),
    // sem precisar editar essa página à mão.
    fetch('grupos.json')
      .then((r) => r.json())
      .then((grupos) => {
        const grid = document.getElementById('grid');
        grid.innerHTML = grupos
          .map((g) => {
            const destaque = g.nichoChave === 'ofertas';
            const nomeCurto = g.nome.replace(/^PromoZap\s*[—-]?\s*/, '').trim();
            return `
              <div class="card${destaque ? ' destaque' : ''}">
                <div class="emoji">${g.emoji}</div>
                <h3>${nomeCurto}</h3>
                <p>${g.descricao}</p>
                <a href="${g.link}" target="_blank" rel="noopener">Entrar no grupo</a>
              </div>
            `;
          })
          .join('');
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p class="lead">Não consegui carregar os grupos agora — tenta de novo daqui a pouco.</p>';
      });
  </script>

  <footer>
    <span>&copy; PromoZap</span>
    <a href="https://frontend-production-f558.up.railway.app/privacidade">Privacidade</a>
    <a href="https://frontend-production-f558.up.railway.app/termos">Termos</a>
    <a href="mailto:guilherme.nevescmp@gmail.com">Contato</a>
  </footer>
</body>
</html>
