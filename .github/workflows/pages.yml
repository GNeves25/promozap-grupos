name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Enfileira deploys em vez de falhar quando um push chega enquanto o
# deploy anterior ainda está rodando (o build "legacy" do Pages não
# tinha isso e colidia com o scheduler do backend, que commita aqui a
# cada 15/30 min).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # Desde 20/11/2026 ~20% dos runs falham com 'No artifacts named
      # "github-pages" were found' logo após o upload dar certo (atraso do
      # lado do GitHub). Uma segunda tentativa 30s depois resolve.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
